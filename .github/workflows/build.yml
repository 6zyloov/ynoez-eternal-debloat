name: build-windows

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run Windows integration tests
        shell: pwsh
        run: dotnet test tests/ynoez.Tests/ynoez.Tests.csproj --configuration Release --logger "console;verbosity=normal"
      - name: Publish self-contained Windows app
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ynoez-win-x64
          path: dist/**
          if-no-files-found: error
          retention-days: 30
