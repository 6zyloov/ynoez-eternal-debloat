name: build-windows

on:
  push:
    branches: [ main, 'fix/**', 'feat/**', 'integration/**' ]
    paths:
      - 'src/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'tests/**'
      - 'scripts/**'
      - 'README.md'
      - 'STATUS.md'
      - 'docs/**'
      - 'installer/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'tests/**'
      - 'scripts/**'
      - 'README.md'
      - 'STATUS.md'
      - 'docs/**'
      - 'installer/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: ynoez-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Show .NET SDK
        shell: pwsh
        run: dotnet --info
      - name: Audit NuGet dependencies
        shell: pwsh
        run: |
          dotnet list src/ynoez/ynoez.csproj package --vulnerable --include-transitive
          if ($LASTEXITCODE -ne 0) { throw "A auditoria de dependências do app falhou." }
          dotnet list tests/ynoez.Tests/ynoez.Tests.csproj package --vulnerable --include-transitive
          if ($LASTEXITCODE -ne 0) { throw "A auditoria de dependências dos testes falhou." }
      - name: Run Windows integration tests
        shell: pwsh
        run: dotnet test tests/ynoez.Tests/ynoez.Tests.csproj --configuration Release --logger "console;verbosity=normal"
      - name: Publish self-contained Windows app
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Test clean install, reinstall and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Validate release packaging and checksums
        shell: pwsh
        run: ./scripts/release.ps1 -DryRun
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: ynoez-portable-win-x64
          path: |
            artifacts/ynoez-portable-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ynoez-setup-win-x64
          path: artifacts/ynoez-setup-*.exe
          if-no-files-found: error
          retention-days: 30
