name: release-windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: ynoez-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify tag and source version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/ynoez/ynoez.csproj
          $expected = "v" + [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag $env:GITHUB_REF_NAME difere da versão $expected." }
          dotnet --version
      - name: Run Windows integration tests
        shell: pwsh
        run: dotnet test tests/ynoez.Tests/ynoez.Tests.csproj --configuration Release --logger "console;verbosity=normal"
      - name: Publish self-contained app
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Test install, upgrade and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Create and publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release.ps1
